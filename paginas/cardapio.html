<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café com Código</title>
    <link rel="stylesheet" href="../estilos/index.css">
    <link rel="stylesheet" href="../estilos/cardapio.css">
</head>
<body>
    <header>
        <img class="logo" src="../imagens/logo.png" alt="logo do site">
        <h1>Café com Código</h1>
        <h3>A melhor forma de tomar café!</h3>
    </header>
    <main class="cardapio">
        <nav>
            <ul>
                <li><a class="nav" href="../index.html">Página Inicial</a></li>
                <li><a class="nav" href="cardapio.html">Cardápio Virtual</a></li>
            </ul>
        </nav>
        <br><br>
        <section>
            <h3 class="titulo">Cafés e Pratos!</h3>
            <br>
            <article id="article">
                <figure>
                    <img class="pratos" src="../imagens/coffe_run.jpg" alt="cafe">
                    <figcaption class="legenda">Coffee.run()</figcaption>
                </figure>
                <figure>
                    <img class="pratos" src="../imagens/caramel_cache.jpg" alt="caramelo">
                    <figcaption class="legenda">Caramel Cache</figcaption>
                </figure>
                <figure>
                    <img class="pratos" src="../imagens/commit_croissant.jpg" alt="croissant">
                    <figcaption class="legenda">Commit de Croissant</figcaption>
                </figure>
                <figure>
                    <img class="pratos" src="../imagens/cinnamonLoop.jpg" alt="cinnamon">
                    <figcaption class="legenda">Cinnamon Loop</figcaption>
                </figure>
            </article>
        </section>
    </main>
</body>
</html>
